# roster-freshness — PR gate on the roster's generated-at stamp.
#
# ============================== PROVENANCE ==============================
# Why added : P1 (FRESHNESS) of the fleet centralization plan (superbot
#             docs/planning/fleet-centralization-plan-2026-07-11.md §3a):
#             a stale roster must be impossible to miss. Lives in its OWN
#             workflow file because substrate-gate.yml is KIT-OWNED
#             (adopt/upgrade overwrites hand edits — its header says
#             host customizations go in a separate workflow).
# Date      : 2026-07-11 (lane worker, model: fable-5, dispatched by
#             coordinator cse_012o8pySy5K3AV6JWoPKryZL; fleet-manager PR #81)
# Reliability: unverified — confirm its output against ground truth a few
#             times across sessions before trusting it.
# Kill-switch: delete this if it proves unreliable over multiple sessions.
# ========================================================================
#
# SEVERITY (decide-and-flag, PR #81; the plan doc leaves it unstated):
#   BLOCKING on manager-authored branches (claude/*) — the manager owns
#   roster custody, so its own PRs red until the roster is regenerated
#   (that is the plan's "make regen a required, verified wake step" given
#   teeth). ADVISORY (warn, exit 0) on every other branch — a lane/owner
#   PR is never jammed by the manager's stale roster.
# ===================== RETIRED 2026-08-07 (owner directive) =====================
# Retired with the roster it guarded — the owner: "Yes retire the roster, I
# don't need it." A freshness gate on a file nothing regenerates any more is a
# check that can only ever go red.
#
# It had become pure noise with teeth: because the regen job deadlocked
# (see roster-regen.yml's header), the roster froze, and this workflow then
# failed on EVERY claude/* PR for reasons that had nothing to do with the PR's
# contents. It never blocked a merge — substrate-gate is the sole required check
# on main, verified from the rulesets API — but a red X that always means
# "ignore me" is worse than no check, because it teaches you to ignore red.
#
# The `pull_request` trigger is removed; workflow_dispatch is kept so the
# freshness of a hand-regenerated roster can still be checked on demand.
# scripts/check_roster_freshness.py is untouched and still runnable directly.
# Nothing deleted — OD-3.
# ================================================================================
name: roster-freshness
on:
  workflow_dispatch:
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: roster freshness (on-demand — always BLOCKING)
        # The old body branched on `github.head_ref`, which is populated for
        # pull_request events and EMPTY on workflow_dispatch. After the retirement
        # left only the dispatch trigger, every manual run would have fallen into
        # the `*)` advisory branch and exited 0 on a stale roster — an on-demand
        # check that cannot report the thing it exists to report. Caught by Codex
        # on PR #812.
        #
        # A dispatch is now unconditionally blocking: you only run this by hand,
        # deliberately, after regenerating the roster, and a silent pass would make
        # the run pointless. `--advisory` is still available by running
        # scripts/check_roster_freshness.py directly.
        run: |
          echo "on-demand roster freshness (ref: ${{ github.ref_name }}) — BLOCKING"
          python3 scripts/check_roster_freshness.py
